[package]
name = "xet"
version = "1.3.2"
edition = "2024"
description = "Session-based file upload/download API for XetHub"
license = "MIT OR Apache-2.0"
repository = "https://github.com/huggingface/xet-core"
keywords = ["xet", "upload", "download", "deduplication", "session", "huggingface"]
categories = ["api-bindings"]

[lib]
name = "xet"
path = "src/lib.rs"

[dependencies]
xet-runtime = { path = "../runtime" }
xet-core-structures = { path = "../core_structures" }
xet-client = { path = "../client" }
xet-data = { path = "../data" }

async-trait = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
